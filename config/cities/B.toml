# City B (II §5, II §16.3, II §5): two Sentinels, rain that comes and goes.
letter = "B"
name = "CYBERCITY TWO"
map = 2                  # the C<n> map file this city is played on
max_multiplier = 20       # the multiplier ceiling, at most 51 (I §9.2.6)
tower_output = 1         # 0 Low, 1 Normal, 2 High
max_module_level = 4     # highest module level in stock, 0-5
capacity = 16             # players per city (II §6)
team_policy = "request-or-balance"   # or "balance", "random"
balance_teams = [0, 1, 2, 3]         # teams the balancer may fill
banned_modules = []       # catalog indices refused as "no X modules in stock"
enabled = true
sentinels = 2             # resident Sentinels (II §16.3)
sentinel_respawn = 300    # seconds before a destroyed one is replaced
# Territory (II §5): rows are cell Z 0..7, digits are cell X 0..7, classes 0-3 worth
# 1/2/5/10. Rings 1/2/5/10 toward the center.
blocks = [
  "00000000",
  "01111110",
  "01222210",
  "01233210",
  "01233210",
  "01222210",
  "01111110",
  "00000000",
]

# The weather program, looped from the moment the city's game starts (II §5). Each step
# waits `after` seconds since the previous one, then sets what it names: light (palette 0-4), rain
# (0-3), lightning. Light changes must be 55 s apart, the wrap included.
[[ambient]]
after = 600
rain = 2

[[ambient]]
after = 300
rain = 0
