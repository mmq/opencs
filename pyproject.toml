[project]
name = "opencs"
version = "0.0.0"
description = "A server compatible with the 1993 online game CyberStrike"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencs"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004"]  # magic-value comparisons: protocol code compares against spec constants

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: starts a server subprocess"]
