[project]
name = "opencs"
version = "1.0.0rc1"
description = "A server compatible with the 1993 online game CyberStrike"
readme = "README.md"
license = { text = "MIT" }
keywords = ["game-server", "serial", "dosbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencs"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]  # prose with code samples, not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004"]  # magic-value comparisons: protocol code compares against spec constants

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers -m 'not judge'"
markers = [
    "e2e: starts a server subprocess",
    "judge: runs tools/judge.py against a server it starts (slow, real time); deselected by default, run with -m judge",
]
